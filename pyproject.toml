[project]
name = "curriculum-builder"
version = "0.1.0"
description = "Builds a personalised YouTube learning curriculum for a goal, a time budget and a learner profile."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.2",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "certifi",
    "pymongo>=4.6",
]

[project.scripts]
curriculum = "curriculum.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curriculum", "evals"]
